name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile' # Déclenche le build automatiquement si vous modifiez CE Dockerfile
  schedule:
    - cron: '0 2 * * *' # Vérification automatique tous les jours à 2h00 du matin
  workflow_dispatch: # Bouton manuel pour forcer le build depuis l'onglet Actions
    inputs:
      force_no_cache:
        description: 'Forcer le build sans aucun cache (Clean Build)'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile # Chemin exact vers votre Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          pull: true 
          no-cache: ${{ github.event.inputs.force_no_cache == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
